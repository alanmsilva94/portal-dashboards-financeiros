<script>
/* ===== js/models/PlanilhaModel.js ===== */
/* =========================================================================
   models/PlanilhaModel.js — leitura das planilhas .xlsx (substitui o etl.py)

   Entra: lista de File (os .xlsx da pasta). Sai: { fatos, igrejas, maquinas,
   avisos }. Não toca no DOM: as mensagens vão para o `log` recebido, que o
   Controller liga à View da janela de importação.

   Regras mantidas do Python:
     * acha as abas mesmo com variação de acento/caixa ("Cartões", "CARTAO");
     * acha as colunas do mesmo jeito ("Valor transação", "valor_transacao");
     * empilha Cartões e Pix em uma tabela de fatos com esquema estável;
     * Pix entra com Tipo = Bandeira = rótulo do Pix.
   ========================================================================= */

(function (App) {
  "use strict";

  const T = App.utils.texto;

  /* ------------------------------------------------------------ dicionários
     Para aceitar um novo cabeçalho sem mexer aqui, use aliasColunasExtra (config.js). */

  const ABAS = {
    igrejas: ["igrejas", "igreja", "cadastroigrejas", "unidades"],
    maquinas: ["maquinas", "maquina", "pdvs", "pdv", "terminais", "pos"],
    cartoes: ["cartoes", "cartao", "cartaodecredito", "vendascartao", "transacoescartao"],
    pix: ["pix", "transacoespix", "vendaspix"],
  };

  const COLS_IGREJAS = {
    igreja_id: ["ID", "Id Igreja", "ID_Igreja", "Codigo"],
    igreja_nome: ["Nome", "Razao Social"],
    igreja_fantasia: ["N Fantasia", "Nome Fantasia"],
    igreja_desc: [
      "Desc Igreja", "Desc.Igreja", "Desc. Igreja", "Descricao Igreja", "Descricao da Igreja",
      "Desc da Igreja", "Tipo Igreja", "Tipo de Igreja", "Classificacao",
      "Classificacao da Unidade", "Classificacao Igreja", "Perfil Igreja",
    ],
    /* Endereço e Bairro não alimentam nenhuma análise: o reducer do sincronizador não os envia */
    estado: ["Estado", "UF"],
    municipio: ["Municipio", "Cidade"],
    regiao: ["Desc.Regiao", "Desc Regiao", "Regiao"],
    status_igreja: ["Status"],
    qtd_membros: ["Qtd.Membros", "Qtd Membros", "Membros"],
    tipo_imovel: ["Tipo Imovel", "Tipo do Imovel"],
  };

  const COLS_MAQUINAS = {
    pdv: ["PDV", "Pdv", "Ponto de Venda"],
    numero_serie: ["N de serie", "Numero de serie", "Serie", "Serial"],
    modelo: ["Modelo"],
    igreja_id: ["ID_Igreja", "ID Igreja", "IdIgreja", "ID"],
  };

  const COLS_CARTOES = {
    data: ["Data", "Data Transacao", "Data da Venda"],
    pdv: ["Pdv", "PDV"],
    tipo: ["Tipo", "Tipo Transacao", "Modalidade"],
    bandeira: ["Bandeira"],
    valor: ["Valor", "Valor Transacao"],
    status: ["Status", "Situacao"],
  };

  const COLS_PIX = {
    data: ["Data", "Data Transacao"],
    status: ["Status", "Situacao"],
    pdv: ["PDV", "Pdv"],
    valor: ["Valor transacao", "Valor", "Valor da transacao"],
  };

  /* nome humano de cada campo, para os avisos não citarem chaves internas */
  const ROTULO_CAMPO = {
    igreja_id: "ID da igreja", igreja_nome: "Nome", igreja_fantasia: "Nome fantasia",
    igreja_desc: "Descrição da igreja", endereco: "Endereço", estado: "Estado",
    municipio: "Município", bairro: "Bairro", regiao: "Região", status_igreja: "Status da igreja",
    qtd_membros: "Qtd. de membros", tipo_imovel: "Tipo de imóvel", pdv: "PDV",
    numero_serie: "Nº de série", modelo: "Modelo", data: "Data", tipo: "Tipo",
    bandeira: "Bandeira", valor: "Valor", status: "Status",
  };

  /* ------------------------------------------------------------ apoio */

  function identificarAba(nome, cabecalhos) {
    const s = T.slug(nome);
    for (const [tipo, aliases] of Object.entries(ABAS)) {
      if (aliases.some((a) => T.slug(a) === s)) return tipo;
    }
    for (const [tipo, aliases] of Object.entries(ABAS)) {
      if (aliases.some((a) => s.includes(T.slug(a)))) return tipo;
    }
    /* sem nome reconhecível: tenta pelas colunas presentes */
    const cols = cabecalhos.map(T.slug);
    if (cols.includes("bandeira") && cols.includes("valor")) return "cartoes";
    if (cols.some((c) => c.includes("valortransacao"))) return "pix";
    if (cols.includes("idigreja") || (cols.includes("modelo") && cols.includes("pdv"))) return "maquinas";
    if (cols.includes("descregiao") || cols.includes("qtdmembros")) return "igrejas";
    return null;
  }

  function aliasesDe(destino, base) {
    const extra = (App.Config.aliasColunasExtra && App.Config.aliasColunasExtra[destino]) || [];
    return extra.concat(base);
  }

  /* Mapeia as colunas da aba para o esquema interno. Coluna ausente vira
     "Não informado" em TODAS as linhas — por isso o aviso mostra o nome humano
     do campo e os cabeçalhos que existem, para o próximo passo ser óbvio. */
  function mapear(cabecalhos, mapa, aba, log, avisos) {
    const resolvido = {};
    const ausentes = [];
    const usados = [];

    for (const [destino, base] of Object.entries(mapa)) {
      const real = T.acharColuna(cabecalhos, aliasesDe(destino, base));
      resolvido[destino] = real;
      const rotulo = ROTULO_CAMPO[destino] || destino;
      if (real) usados.push(`${rotulo} ← "${real}"`);
      else ausentes.push(rotulo);
    }

    log.info(`  ${aba}: ${usados.join(" · ")}`);

    if (ausentes.length) {
      log.aviso(
        `${aba}: não encontrei a coluna de ${ausentes.join(", ")}. ` +
          `Cabeçalhos da planilha: ${cabecalhos.join(", ")}.`
      );
      log.aviso(
        "esses campos ficarão como “Não informado”. Acrescente o nome certo em " +
          "aliasColunasExtra, no js/config.js, e recarregue a página."
      );
      /* a mesma ausência se repete em cada mês: um aviso só na faixa do topo */
      const titulo = `Coluna de ${ausentes.join(", ")} não encontrada na aba ${aba}`;
      if (!avisos.some((a) => a.titulo === titulo)) {
        avisos.push({ titulo, detalhe: `Cabeçalhos disponíveis: ${cabecalhos.join(", ")}.` });
      }
    }
    return resolvido;
  }

  /* o relatório de colunas é igual em todos os meses: só na 1ª aba de cada tipo */
  function logUmaVez(vistas, chave, log) {
    if (vistas.has(chave)) return Object.assign({}, log, { info: () => {} });
    vistas.add(chave);
    return log;
  }

  const pausa = () => new Promise((r) => setTimeout(r, 0)); /* deixa a tela repintar */

  /* ------------------------------------------------------------ API */

  const PlanilhaModel = {
    /* `itens` = [{ nome, relPath, mtime, workbook }] entregues por PORTAL.carregar()
       (o workbook já vem montado; a planilha foi pré-agregada no sincronizador, ver
       sincronizador/reducers/maquinas.py: as abas Cartões/Pix podem trazer a coluna "Qtd") */
    async ler(itens, log) {

      const regras = App.Config.regras;
      const SEM_LOCAL = regras.semLocalidade;
      const statusAprovados = new Set(regras.statusAprovados.map(T.slug));
      const rotuloPix = regras.rotuloPix;

      const fatos = [];
      const igrejas = new Map();
      const maquinas = new Map();
      const avisos = [];
      const abasVistas = new Set();
      let descartadas = 0;

      const planilhas = itens.slice().sort((a, b) => a.nome.localeCompare(b.nome));

      if (!planilhas.length) throw new Error("Nenhum arquivo de dados foi encontrado no Drive.");

      for (const arquivo of planilhas) {
        log.info(`lendo ${arquivo.nome}`);
        await pausa();

        const livro = arquivo.workbook;
        if (!livro) {
          log.aviso(`${arquivo.nome}: arquivo sem conteúdo`);
          continue;
        }

        const reconhecidas = new Set();

        for (const nomeAba of livro.SheetNames) {
          const linhas = XLSX.utils.sheet_to_json(livro.Sheets[nomeAba], { defval: null, raw: true });
          if (!linhas.length) continue;

          const cabecalhos = Object.keys(linhas[0]);
          const tipoAba = identificarAba(nomeAba, cabecalhos);
          if (!tipoAba) {
            log.info(`  aba ignorada: "${nomeAba}"`);
            continue;
          }
          reconhecidas.add(tipoAba);

          if (tipoAba === "igrejas") {
            const col = mapear(cabecalhos, COLS_IGREJAS, "Igrejas", logUmaVez(abasVistas, "igrejas", log), avisos);
            for (const linha of linhas) {
              const id = T.chave(linha[col.igreja_id]);
              if (!id) continue;
              const loc = (campo, fn) =>
                T.naoInformado(linha[col[campo]]) ? SEM_LOCAL : fn(T.texto(linha[col[campo]], SEM_LOCAL));
              igrejas.set(id, {
                igreja_id: id,
                igreja_nome: T.texto(linha[col.igreja_nome], "Sem cadastro"),
                igreja_fantasia: T.texto(linha[col.igreja_fantasia], null),
                igreja_desc: T.texto(linha[col.igreja_desc], "Não informado"),
                regiao: loc("regiao", T.capitalizar),
                estado: loc("estado", (t) => t.toUpperCase()),
                municipio: loc("municipio", T.capitalizar),
                status_igreja: T.capitalizar(T.texto(linha[col.status_igreja], "Não informado")),
                tipo_imovel: T.capitalizar(T.texto(linha[col.tipo_imovel], "Não informado")),
                qtd_membros: Math.round(T.paraFloat(linha[col.qtd_membros]) || 0),
              });
            }
          } else if (tipoAba === "maquinas") {
            const col = mapear(cabecalhos, COLS_MAQUINAS, "Maquinas", logUmaVez(abasVistas, "maquinas", log), avisos);
            for (const linha of linhas) {
              const pdv = T.chave(linha[col.pdv]);
              if (!pdv) continue;
              maquinas.set(pdv, {
                pdv: pdv,
                igreja_id: T.chave(linha[col.igreja_id]),
                modelo: T.texto(linha[col.modelo], "Não informado").toUpperCase(),
                numero_serie: T.texto(linha[col.numero_serie], "Não informado"),
              });
            }
          } else {
            const cartao = tipoAba === "cartoes";
            const col = mapear(
              cabecalhos,
              cartao ? COLS_CARTOES : COLS_PIX,
              cartao ? "Cartões" : "Pix",
              logUmaVez(abasVistas, tipoAba, log),
              avisos
            );

            /* "Qtd" (opcional): nº de transações já somadas na linha pré-agregada; ausente = 1 */
            const colQtd = cabecalhos.find((c) => T.slug(c) === "qtd") || null;

            for (const linha of linhas) {
              const data = T.paraData(linha[col.data]);
              const pdv = T.chave(linha[col.pdv]);
              const valor = T.paraFloat(linha[col.valor]);
              if (!data || !pdv || valor === null) {
                descartadas++;
                continue;
              }
              const status = T.capitalizar(T.texto(linha[col.status], "Não informado"));
              fatos.push({
                anoMes: `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, "0")}`,
                pdv: pdv,
                canal: cartao ? "Cartão" : "Pix",
                tipo: cartao ? T.capitalizar(T.texto(linha[col.tipo], "Não informado")) : rotuloPix,
                bandeira: cartao ? T.capitalizar(T.texto(linha[col.bandeira], "Não informado")) : rotuloPix,
                status: status,
                aprovada: statusAprovados.has(T.slug(status)),
                valor: valor,
                qtd: colQtd ? Math.max(1, Math.round(T.paraFloat(linha[colQtd]) || 1)) : 1,
              });
            }
          }
        }

        for (const esperada of ["cartoes", "pix"]) {
          if (!reconhecidas.has(esperada)) log.aviso(`${arquivo.nome}: aba de ${esperada} não encontrada`);
        }
      }

      /* coluna localizada, mas vazia em todas as igrejas: o filtro sai com uma opção só */
      const conferirVazia = (campo, padrao) => {
        if (!igrejas.size) return;
        const valores = new Set();
        igrejas.forEach((ig) => valores.add(ig[campo]));
        if (valores.size === 1 && valores.has(padrao)) {
          const rotulo = ROTULO_CAMPO[campo] || campo;
          log.aviso(`a coluna de ${rotulo} foi localizada, mas está vazia em todas as igrejas`);
          avisos.push({
            titulo: `Coluna de ${rotulo} vazia na aba Igrejas`,
            detalhe: "A coluna existe, mas nenhuma linha tem valor preenchido.",
          });
        }
      };
      conferirVazia("igreja_desc", "Não informado");
      conferirVazia("regiao", SEM_LOCAL);
      conferirVazia("estado", SEM_LOCAL);

      if (!fatos.length) throw new Error("Nenhuma transação válida foi encontrada nas abas Cartões/Pix.");
      if (!maquinas.size) throw new Error("Aba 'Maquinas' não encontrada — ela liga o PDV à igreja.");
      if (descartadas) log.aviso(`${descartadas} linha(s) descartada(s) por data, PDV ou valor inválidos`);
      if (!fatos.some((f) => f.aprovada)) {
        log.aviso("nenhum status foi reconhecido como aprovado — confira statusAprovados no js/config.js");
      }

      return { fatos, igrejas, maquinas, avisos, planilhas: planilhas.length };
    },
  };

  App.models.PlanilhaModel = PlanilhaModel;
})(window.App);

/* ===== js/models/CuboModel.js ===== */
/* =========================================================================
   models/CuboModel.js — fatos + cadastros -> cubo compacto (substitui o analytics.py)

   Por que um cubo: os filtros rodam no navegador a cada clique. Agregar as
   transações em PDV × mês × canal × tipo × bandeira × status, com os textos
   trocados por índices, deixa a reagregação barata e a base salva pequena.

   O formato é o mesmo do projeto Python, então bases salvas pela versão
   anterior continuam abrindo.
   ========================================================================= */

(function (App) {
  "use strict";

  const T = App.utils.texto;
  const FMT = App.utils.formato;

  /* dimensão de PDV vazia, para PDV que transacionou sem estar cadastrado */
  function dimensaoOrfa(pdv, semLocal) {
    return {
      pdv: pdv,
      igreja_id: "Sem cadastro",
      igreja: "Sem cadastro",
      desc_igreja: "Não informado",
      regiao: semLocal,
      estado: semLocal,
      municipio: semLocal,
      modelo: "Não informado",
      serie: "Não informado",
      status_igreja: "Não informado",
      tipo_imovel: "Não informado",
      membros: 0,
    };
  }

  const CuboModel = {
    COLUNAS: ["pdv", "mes", "canal", "tipo", "bandeira", "status", "valor", "qtd"],

    montar(base, rotuloFonte) {
      const { fatos, igrejas, maquinas } = base;
      const cfg = App.Config;
      const regras = cfg.regras;
      const semLocal = regras.semLocalidade;

      /* dimensão de PDV: máquina + cadastro da igreja */
      const dimPorPdv = new Map();
      for (const maquina of maquinas.values()) {
        const igreja = igrejas.get(maquina.igreja_id) || {};
        dimPorPdv.set(maquina.pdv, {
          pdv: maquina.pdv,
          igreja_id: maquina.igreja_id || "Sem cadastro",
          igreja: igreja.igreja_fantasia || igreja.igreja_nome || "Sem cadastro",
          desc_igreja: igreja.igreja_desc || "Não informado",
          regiao: igreja.regiao || semLocal,
          estado: igreja.estado || semLocal,
          municipio: igreja.municipio || semLocal,
          modelo: maquina.modelo,
          serie: maquina.numero_serie,
          status_igreja: igreja.status_igreja || "Não informado",
          tipo_imovel: igreja.tipo_imovel || "Não informado",
          membros: igreja.qtd_membros || 0,
        });
      }

      /* PDV que transacionou sem cadastro não pode sumir do dashboard */
      let orfaos = 0;
      for (const fato of fatos) {
        if (!dimPorPdv.has(fato.pdv)) {
          orfaos++;
          dimPorPdv.set(fato.pdv, dimensaoOrfa(fato.pdv, semLocal));
        }
      }

      const listaPdv = T.ordenarPt(new Set(dimPorPdv.keys()));
      const listaMes = Array.from(new Set(fatos.map((f) => f.anoMes))).sort();
      const listaCanal = T.ordenarPt(new Set(fatos.map((f) => f.canal)));
      const listaTipo = T.ordenarPt(new Set(fatos.map((f) => f.tipo)));
      const listaBandeira = T.ordenarPt(new Set(fatos.map((f) => f.bandeira)));
      const listaStatus = T.ordenarPt(new Set(fatos.map((f) => f.status)));

      const iPdv = T.indexar(listaPdv);
      const iMes = T.indexar(listaMes);
      const iCanal = T.indexar(listaCanal);
      const iTipo = T.indexar(listaTipo);
      const iBand = T.indexar(listaBandeira);
      const iStatus = T.indexar(listaStatus);

      /* agrega em PDV × mês × canal × tipo × bandeira × status */
      const grupos = new Map();
      for (const f of fatos) {
        const k =
          `${iPdv.get(f.pdv)}|${iMes.get(f.anoMes)}|${iCanal.get(f.canal)}|` +
          `${iTipo.get(f.tipo)}|${iBand.get(f.bandeira)}|${iStatus.get(f.status)}`;
        const atual = grupos.get(k);
        if (atual) {
          atual[0] += f.valor;
          atual[1] += f.qtd || 1;
        } else {
          grupos.set(k, [f.valor, f.qtd || 1]);
        }
      }

      const linhas = [];
      for (const [k, [valor, qtd]] of grupos) {
        const p = k.split("|");
        linhas.push([+p[0], +p[1], +p[2], +p[3], +p[4], +p[5], Math.round(valor * 100) / 100, qtd]);
      }

      const statusAprovados = new Set(regras.statusAprovados.map(T.slug));
      const dimensao = listaPdv.map((p) => dimPorPdv.get(p));

      return {
        meta: {
          gerado_em: FMT.dataHora(new Date()),
          titulo: cfg.marca.titulo,
          subtitulo: cfg.marca.subtitulo,
          periodo_inicio: listaMes.length ? FMT.rotuloMes(listaMes[0]) : "-",
          periodo_fim: listaMes.length ? FMT.rotuloMes(listaMes[listaMes.length - 1]) : "-",
          qtd_transacoes: fatos.reduce((s, f) => s + (f.qtd || 1), 0),
          linhas_cubo: linhas.length,
          min_transacoes_ativo: regras.minTransacoesAtivo || 1,
          rotulo_sem_localidade: semLocal,
          fonte: rotuloFonte,
          avisos: base.avisos || [],
          orfaos: orfaos,
        },
        dicionarios: {
          pdv: listaPdv,
          ano_mes: listaMes,
          ano_mes_rotulo: listaMes.map(FMT.rotuloMes),
          canal: listaCanal,
          tipo: listaTipo,
          bandeira: listaBandeira,
          status: listaStatus,
          status_aprovado: listaStatus.map((s) => statusAprovados.has(T.slug(s))),
          regiao: T.ordenarPt(new Set(dimensao.map((d) => d.regiao))),
          desc_igreja: T.ordenarPt(new Set(dimensao.map((d) => d.desc_igreja))),
          estado: T.ordenarPt(new Set(dimensao.map((d) => d.estado))),
          modelo: T.ordenarPt(new Set(dimensao.map((d) => d.modelo))),
        },
        dim_pdv: dimensao,
        fatos: { colunas: CuboModel.COLUNAS, linhas },
        paleta: cfg.paleta,
      };
    },

    /* confere se um objeto (base salva ou .json importado) tem cara de cubo */
    valido(cubo) {
      return !!(
        cubo &&
        cubo.meta &&
        cubo.dicionarios &&
        Array.isArray(cubo.dim_pdv) &&
        cubo.fatos &&
        Array.isArray(cubo.fatos.linhas)
      );
    },
  };

  App.models.CuboModel = CuboModel;
})(window.App);

/* ===== js/models/FiltroModel.js ===== */
/* =========================================================================
   models/FiltroModel.js — estado dos filtros, da página e da tabela

   Guarda só ÍNDICES (posição no dicionário do cubo). Toda alteração emite
   "mudou", que o DashboardController escuta para recalcular e redesenhar.
   ========================================================================= */

(function (App) {
  "use strict";

  const todos = (n) => new Set(Array.from({ length: n }, (_, i) => i));

  class FiltroModel extends App.utils.Emissor {
    constructor() {
      super();
      this.definicoes = []; /* [{ chave, titulo, opcoes }] */
      this.nMeses = 0;
      this.mesDe = 0;
      this.mesAte = 0;
      this.selecao = {};    /* chave -> Set de índices marcados */
      this.pagina = "receita";
      this.tabela = { coluna: "receita", desc: true, abertos: new Set(), busca: "" };
    }

    /* chamado a cada nova base: todos os filtros voltam a "Todos" */
    configurar(dicionarios) {
      /* para acrescentar ou tirar um filtro, edite esta lista */
      this.definicoes = [
        { chave: "regiao", titulo: "Região", opcoes: dicionarios.regiao },
        { chave: "estado", titulo: "Estado", opcoes: dicionarios.estado },
        { chave: "desc_igreja", titulo: "Descrição da igreja", opcoes: dicionarios.desc_igreja },
        { chave: "tipo", titulo: "Tipo de transação", opcoes: dicionarios.tipo },
        { chave: "bandeira", titulo: "Bandeira", opcoes: dicionarios.bandeira },
      ];
      this.nMeses = dicionarios.ano_mes.length;
      this.tabela.abertos.clear();
      this.tabela.busca = "";
      this._resetar();
    }

    _resetar() {
      this.mesDe = 0;
      this.mesAte = Math.max(0, this.nMeses - 1);
      this.definicoes.forEach((f) => {
        this.selecao[f.chave] = todos(f.opcoes.length);
      });
    }

    /* ---------------------------------------------------- consultas */

    definicao(chave) {
      return this.definicoes.find((f) => f.chave === chave);
    }

    periodoCompleto() {
      return this.mesDe === 0 && this.mesAte === this.nMeses - 1;
    }

    filtrado(chave) {
      const f = this.definicao(chave);
      return f ? this.selecao[chave].size !== f.opcoes.length : false;
    }

    resumo(chave) {
      const f = this.definicao(chave);
      const sel = this.selecao[chave].size;
      const total = f.opcoes.length;
      if (sel === total) return `Todos (${total})`;
      if (sel === 0) return "Nenhum";
      if (sel === 1) return f.opcoes[Array.from(this.selecao[chave])[0]];
      return `${sel} de ${total}`;
    }

    /* ---------------------------------------------------- alterações */

    marcar(chave, indice, marcado) {
      if (marcado) this.selecao[chave].add(indice);
      else this.selecao[chave].delete(indice);
      this.emit("mudou");
    }

    marcarVarios(chave, indices, marcado) {
      indices.forEach((i) => (marcado ? this.selecao[chave].add(i) : this.selecao[chave].delete(i)));
      this.emit("mudou");
    }

    limparFiltro(chave) {
      this.selecao[chave] = todos(this.definicao(chave).opcoes.length);
      this.emit("mudou");
    }

    /* de > até é corrigido puxando o outro extremo, como na versão anterior */
    definirPeriodo(de, ate, quemMudou) {
      if (de > ate) {
        if (quemMudou === "de") ate = de;
        else de = ate;
      }
      this.mesDe = de;
      this.mesAte = ate;
      this.emit("mudou");
    }

    limparPeriodo() {
      this.mesDe = 0;
      this.mesAte = Math.max(0, this.nMeses - 1);
      this.emit("mudou");
    }

    limparTudo() {
      this._resetar();
      this.emit("mudou");
    }

    /* ---------------------------------------------------- tabela e página */

    ordenarPor(coluna) {
      if (this.tabela.coluna === coluna) this.tabela.desc = !this.tabela.desc;
      else {
        this.tabela.coluna = coluna;
        this.tabela.desc = coluna !== "nome";
      }
      this.emit("tabela");
    }

    alternarEstado(idx) {
      if (this.tabela.abertos.has(idx)) this.tabela.abertos.delete(idx);
      else this.tabela.abertos.add(idx);
      this.emit("tabela");
    }

    /* abre todos os estados indicados ou, se já estiverem todos abertos, fecha */
    alternarTodos(indices) {
      const todosAbertos = indices.length && indices.every((i) => this.tabela.abertos.has(i));
      this.tabela.abertos.clear();
      if (!todosAbertos) indices.forEach((i) => this.tabela.abertos.add(i));
      this.emit("tabela");
    }

    buscar(texto) {
      this.tabela.busca = texto || "";
      this.emit("tabela");
    }

    irPara(pagina) {
      this.pagina = pagina;
      this.emit("pagina", pagina);
    }
  }

  App.models.FiltroModel = FiltroModel;
})(window.App);

/* ===== js/models/PainelModel.js ===== */
/* =========================================================================
   models/PainelModel.js — o cubo carregado e todos os cálculos do painel

   Recebe o cubo, monta os índices de cadastro (região, estado, descrição,
   município) e, a cada mudança de filtro, devolve o resultado agregado que as
   Views desenham. Nada aqui conhece HTML ou Plotly.
   ========================================================================= */

(function (App) {
  "use strict";

  const F_PDV = 0, F_MES = 1, F_TIPO = 3, F_BAND = 4, F_STATUS = 5, F_VALOR = 6, F_QTD = 7;

  function mascara(conjunto, tamanho) {
    const m = new Uint8Array(tamanho);
    conjunto.forEach((i) => {
      if (i >= 0 && i < tamanho) m[i] = 1;
    });
    return m;
  }

  class PainelModel {
    constructor() {
      this.cubo = null;
      this.semLocal = App.Config.regras.semLocalidade;
    }

    get temDados() {
      return this.cubo !== null;
    }

    get dic() {
      return this.cubo.dicionarios;
    }

    /* ---------------------------------------------------- vincula um cubo */

    carregar(cubo) {
      const D = cubo.dicionarios;
      const DIM = cubo.dim_pdv;
      this.cubo = cubo;
      this.linhas = cubo.fatos.linhas;
      this.statusOk = D.status_aprovado;
      this.semLocal = (cubo.meta && cubo.meta.rotulo_sem_localidade) || App.Config.regras.semLocalidade;

      /* cubos antigos podem não ter a dimensão de descrição */
      if (!D.desc_igreja || !D.desc_igreja.length) {
        D.desc_igreja = ["Não informado"];
        DIM.forEach((d) => (d.desc_igreja = d.desc_igreja || "Não informado"));
      }

      const iRegiao = App.utils.texto.indexar(D.regiao);
      const iEstado = App.utils.texto.indexar(D.estado);
      const iDesc = App.utils.texto.indexar(D.desc_igreja);

      /* valor fora do dicionário é ACRESCENTADO, nunca jogado no índice 0 */
      const indiceDe = (mapa, lista, valor) => {
        const v = valor === null || valor === undefined || valor === "" ? this.semLocal : String(valor);
        if (!mapa.has(v)) {
          mapa.set(v, lista.length);
          lista.push(v);
        }
        return mapa.get(v);
      };

      const n = D.pdv.length;
      this.nPdv = n;
      this.pdvRegiao = new Int16Array(n);
      this.pdvEstado = new Int16Array(n);
      this.pdvDesc = new Int16Array(n);
      this.pdvMunicipio = new Int32Array(n);
      this.pdvIgreja = new Array(n);

      /* município não é dimensão do cubo: chave COMPOSTA estado + município,
         para homônimos ("Bom Jesus") e "Sem localidade" não se misturarem */
      const iMun = new Map();
      this.munNome = [];
      const munEstado = [];

      DIM.forEach((d, i) => {
        this.pdvRegiao[i] = indiceDe(iRegiao, D.regiao, d.regiao);
        this.pdvEstado[i] = indiceDe(iEstado, D.estado, d.estado);
        this.pdvDesc[i] = indiceDe(iDesc, D.desc_igreja, d.desc_igreja);
        this.pdvIgreja[i] = d.igreja_id;

        const nome = d.municipio || this.semLocal;
        const chave = this.pdvEstado[i] + "|" + nome;
        if (!iMun.has(chave)) {
          iMun.set(chave, this.munNome.length);
          this.munNome.push(nome);
          munEstado.push(this.pdvEstado[i]);
        }
        this.pdvMunicipio[i] = iMun.get(chave);
      });

      this.munDoEstado = Int16Array.from(munEstado);
      this.idxSemLocalidade = D.estado.indexOf(this.semLocal);
    }

    /* ---------------------------------------------------- agregação */

    agregar(filtro) {
      const D = this.dic;
      const s = filtro.selecao;
      const mRegiao = mascara(s.regiao, D.regiao.length);
      const mEstado = mascara(s.estado, D.estado.length);
      const mDesc = mascara(s.desc_igreja, D.desc_igreja.length);
      const mTipo = mascara(s.tipo, D.tipo.length);
      const mBand = mascara(s.bandeira, D.bandeira.length);

      /* parque instalado que sobrevive aos filtros de cadastro */
      const pdvOk = new Uint8Array(this.nPdv);
      const pdvsFiltrados = [];
      for (let p = 0; p < this.nPdv; p++) {
        if (mRegiao[this.pdvRegiao[p]] && mEstado[this.pdvEstado[p]] && mDesc[this.pdvDesc[p]]) {
          pdvOk[p] = 1;
          pdvsFiltrados.push(p);
        }
      }

      const nMes = D.ano_mes.length, nTipo = D.tipo.length, nBand = D.bandeira.length;
      const nReg = D.regiao.length, nDesc = D.desc_igreja.length, nEst = D.estado.length;
      const nMun = this.munNome.length;
      const F64 = (k) => new Float64Array(k);
      const sets = (k) => Array.from({ length: k }, () => new Set());

      const r = {
        mesDe: filtro.mesDe,
        mesAte: filtro.mesAte,
        receita: 0, movimentacao: 0, qtd: 0, qtdAprovada: 0,
        receitaTipo: F64(nTipo), movTipo: F64(nTipo), qtdTipo: F64(nTipo), qtdAprovTipo: F64(nTipo),
        receitaBandeira: F64(nBand),
        receitaMes: F64(nMes), qtdMes: F64(nMes), qtdAprovMes: F64(nMes),
        receitaRegiao: F64(nReg), qtdRegiao: F64(nReg), maquinasRegiao: F64(nReg),
        receitaDesc: F64(nDesc), qtdDesc: F64(nDesc), maquinasDesc: F64(nDesc),
        receitaEstado: F64(nEst), qtdEstado: F64(nEst), qtdAprovEstado: F64(nEst), maquinasEstado: F64(nEst),
        receitaMun: F64(nMun), qtdMun: F64(nMun), qtdAprovMun: F64(nMun), maquinasMun: F64(nMun),
        igrejasEstado: sets(nEst), igrejasMun: sets(nMun), pdvMesAtivo: sets(nMes),
        qtdAprovPorPdv: F64(this.nPdv),
        pdvsFiltrados, pdvOk, mTipo, mBand,
      };

      const L = this.linhas;
      for (let k = 0; k < L.length; k++) {
        const f = L[k];
        const mes = f[F_MES];
        if (mes < filtro.mesDe || mes > filtro.mesAte) continue;
        const p = f[F_PDV];
        if (!pdvOk[p]) continue;
        if (!mTipo[f[F_TIPO]] || !mBand[f[F_BAND]]) continue;

        const valor = f[F_VALOR], qtd = f[F_QTD], tipo = f[F_TIPO];
        const reg = this.pdvRegiao[p], desc = this.pdvDesc[p];
        const est = this.pdvEstado[p], mun = this.pdvMunicipio[p];

        r.movimentacao += valor;
        r.qtd += qtd;
        r.movTipo[tipo] += valor;
        r.qtdTipo[tipo] += qtd;
        r.qtdMes[mes] += qtd;
        r.qtdRegiao[reg] += qtd;
        r.qtdDesc[desc] += qtd;
        r.qtdEstado[est] += qtd;
        r.qtdMun[mun] += qtd;

        if (this.statusOk[f[F_STATUS]]) {
          r.receita += valor;
          r.qtdAprovada += qtd;
          r.receitaTipo[tipo] += valor;
          r.qtdAprovTipo[tipo] += qtd;
          r.receitaBandeira[f[F_BAND]] += valor;
          r.receitaMes[mes] += valor;
          r.qtdAprovMes[mes] += qtd;
          r.receitaRegiao[reg] += valor;
          r.receitaDesc[desc] += valor;
          r.receitaEstado[est] += valor;
          r.receitaMun[mun] += valor;
          r.qtdAprovEstado[est] += qtd;
          r.qtdAprovMun[mun] += qtd;
          r.qtdAprovPorPdv[p] += qtd;
          r.pdvMesAtivo[mes].add(p);
        }
      }

      const minAtivo = this.cubo.meta.min_transacoes_ativo || App.Config.regras.minTransacoesAtivo || 1;
      r.pdvsAtivos = pdvsFiltrados.filter((p) => r.qtdAprovPorPdv[p] >= minAtivo).length;
      r.pdvsInativos = pdvsFiltrados.length - r.pdvsAtivos;
      r.qtdIgrejas = new Set(pdvsFiltrados.map((p) => this.pdvIgreja[p])).size;

      pdvsFiltrados.forEach((p) => {
        r.maquinasRegiao[this.pdvRegiao[p]] += 1;
        r.maquinasDesc[this.pdvDesc[p]] += 1;
        r.maquinasEstado[this.pdvEstado[p]] += 1;
        r.maquinasMun[this.pdvMunicipio[p]] += 1;
        r.igrejasEstado[this.pdvEstado[p]].add(this.pdvIgreja[p]);
        r.igrejasMun[this.pdvMunicipio[p]].add(this.pdvIgreja[p]);
      });

      return r;
    }

    /* ---------------------------------------------------- consulta por estado */

    linhasEstado(r) {
      const linhas = [];
      for (let e = 0; e < this.dic.estado.length; e++) {
        if (!r.maquinasEstado[e] && !r.qtdEstado[e]) continue;
        linhas.push({
          idx: e,
          nome: this.dic.estado[e],
          pdvs: r.maquinasEstado[e],
          igrejas: r.igrejasEstado[e].size,
          transacoes: r.qtdEstado[e],
          receita: r.receitaEstado[e],
          ticket: r.qtdAprovEstado[e] ? r.receitaEstado[e] / r.qtdAprovEstado[e] : 0,
        });
      }
      return linhas;
    }

    municipiosDoEstado(r, idxEstado) {
      const linhas = [];
      for (let m = 0; m < this.munNome.length; m++) {
        if (this.munDoEstado[m] !== idxEstado) continue;
        if (!r.maquinasMun[m] && !r.qtdMun[m]) continue;
        linhas.push({
          nome: this.munNome[m],
          pdvs: r.maquinasMun[m],
          igrejas: r.igrejasMun[m].size,
          transacoes: r.qtdMun[m],
          receita: r.receitaMun[m],
          ticket: r.qtdAprovMun[m] ? r.receitaMun[m] / r.qtdAprovMun[m] : 0,
        });
      }
      return linhas;
    }

    static ordenar(linhas, tabela) {
      const col = tabela.coluna;
      const sinal = tabela.desc ? -1 : 1;
      return linhas.slice().sort((a, b) => {
        if (col === "nome") return sinal * String(a.nome).localeCompare(String(b.nome), "pt-BR");
        return sinal * (a[col] - b[col]);
      });
    }

    /* tudo o que a página 3 precisa, já separado e ordenado.
       `busca` (texto) esconde linhas sem mexer nos totais: o estado aparece se
       a sigla/nome bater, ou abre sozinho mostrando só os municípios que batem. */
    consultaEstados(r, tabela) {
      const T = App.utils.texto;
      const todas = this.linhasEstado(r);
      const linhas = todas.filter((l) => l.nome !== this.semLocal);
      const semLocal = todas.find((l) => l.nome === this.semLocal) || null;
      const comReceita = linhas.filter((l) => l.receita > 0);
      const totalReceita = todas.reduce((a, l) => a + l.receita, 0);

      const termo = T.slug(tabela.busca || "");
      const bate = (texto) => termo && T.slug(texto).includes(termo);

      const montar = (l) => {
        const municipios = PainelModel.ordenar(this.municipiosDoEstado(r, l.idx), tabela);
        const nomeUf = App.utils.uf.nome(l.nome) || "";
        if (termo && !bate(l.nome) && !bate(nomeUf)) {
          const filhos = municipios.filter((m) => bate(m.nome));
          return filhos.length ? { linha: l, aberto: true, filhos } : null;
        }
        const aberto = tabela.abertos.has(l.idx);
        return { linha: l, aberto, filhos: aberto ? municipios : null };
      };

      return {
        linhas: PainelModel.ordenar(linhas, tabela).map(montar).filter(Boolean),
        semLocal: semLocal ? montar(semLocal) : null,
        temSemLocal: !!semLocal,
        semLocalPdvs: semLocal ? semLocal.pdvs : 0,
        idxVisiveis: todas.map((l) => l.idx),
        busca: tabela.busca || "",
        porReceita: linhas.slice().sort((a, b) => b.receita - a.receita),
        lider: comReceita.slice().sort((a, b) => b.receita - a.receita)[0] || null,
        qtdEstados: linhas.length,
        qtdComReceita: comReceita.length,
        municipios: this.munNome.filter(
          (nome, m) => nome !== this.semLocal && (r.maquinasMun[m] > 0 || r.qtdMun[m] > 0)
        ).length,
        totais: {
          receita: totalReceita,
          transacoes: todas.reduce((a, l) => a + l.transacoes, 0),
          pdvs: todas.reduce((a, l) => a + l.pdvs, 0),
          igrejas: r.qtdIgrejas,
          ticket: r.qtdAprovada ? r.receita / r.qtdAprovada : 0,
        },
        tabela: { coluna: tabela.coluna, desc: tabela.desc },
      };
    }

    /* ---------------------------------------------------- avisos */

    avisos(r) {
      const lista = (this.cubo.meta.avisos || []).map((a) => ({ tipo: "coluna", ...a }));
      const e = this.idxSemLocalidade;
      if (e >= 0 && (r.maquinasEstado[e] || r.qtdEstado[e])) {
        const totalPdvs = r.pdvsFiltrados.length;
        lista.push({
          tipo: "semLocalidade",
          pdvs: r.maquinasEstado[e],
          receita: r.receitaEstado[e],
          partePdv: totalPdvs ? (r.maquinasEstado[e] / totalPdvs) * 100 : 0,
          parteReceita: r.receita ? (r.receitaEstado[e] / r.receita) * 100 : 0,
        });
      }
      return lista;
    }

    /* ---------------------------------------------------- recorte por PDV (CSV) */

    recortePorPdv(r) {
      const porPdv = new Map();
      const L = this.linhas;
      for (let k = 0; k < L.length; k++) {
        const f = L[k];
        if (f[F_MES] < r.mesDe || f[F_MES] > r.mesAte) continue;
        const p = f[F_PDV];
        if (!r.pdvOk[p] || !r.mTipo[f[F_TIPO]] || !r.mBand[f[F_BAND]]) continue;
        if (!porPdv.has(p)) porPdv.set(p, { receita: 0, mov: 0, qtd: 0 });
        const acc = porPdv.get(p);
        acc.mov += f[F_VALOR];
        acc.qtd += f[F_QTD];
        if (this.statusOk[f[F_STATUS]]) acc.receita += f[F_VALOR];
      }

      return r.pdvsFiltrados.map((p) => {
        const d = this.cubo.dim_pdv[p];
        const a = porPdv.get(p) || { receita: 0, mov: 0, qtd: 0 };
        return { ...d, transacoes: a.qtd, movimentacao: a.mov, receita: a.receita };
      });
    }
  }

  App.models.PainelModel = PainelModel;
})(window.App);

</script>
